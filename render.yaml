services:
  # Backend API
  - type: web
    name: research-assistant-api
    env: docker
    dockerContext: ./backend
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: research-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false # Set this in Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app" # User should update this after Vercel deploy

databases:
  - name: research-db
    plan: free
    region: ohio
    databaseName: research_db
    user: research_user
